<div class="phone">
  <span class="notch"></span>
  <p class="greeting">{{ 'phone.greeting' | t }}</p>
  <div class="streak">
    <span class="streak-icon"><landing-icon name="award" /></span>
    <span class="lines">
      <span class="streak-title">{{ 'phone.streakTitle' | t }}</span>
      <span class="streak-text">{{ 'phone.streakText' | t }}</span>
    </span>
  </div>
  <div class="stats">
    @for (stat of stats; track stat.label) {
      <span class="stat">
        <span class="stat-value">{{ stat.value | t }}</span>
        <span class="stat-label">{{ stat.label | t }}</span>
      </span>
    }
  </div>
  @for (item of plan; track item.title) {
    <div class="plan">
      <span class="plan-icon"><landing-icon [name]="item.icon" /></span>
      <span class="lines">
        <span class="plan-title">{{ item.title | t }}</span>
        <span class="plan-text">{{ item.text | t }}</span>
      </span>
    </div>
  }
  <div class="ai">
    <landing-icon name="ai" />
    <span>{{ 'phone.aiCoach' | t }}</span>
  </div>
</div>
