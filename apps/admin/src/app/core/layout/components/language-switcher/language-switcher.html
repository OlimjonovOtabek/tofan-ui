@switch (variant()) {
  @case ('segmented') {
    <div class="language-segments" role="group" [attr.aria-label]="'layout.topbar.language' | t">
      @for (option of options(); track option.locale) {
        <button
          type="button"
          class="language-segment"
          [class.is-on]="option.active"
          [attr.aria-pressed]="option.active"
          [title]="option.name"
          (click)="select(option.locale)"
        >
          {{ option.code }}
        </button>
      }
    </div>
  }
  @case ('floating') {
    <p-button
      type="button"
      [rounded]="true"
      severity="secondary"
      [label]="currentCode()"
      [ariaLabel]="'layout.topbar.language' | t"
      (onClick)="menu.toggle($event)"
    />
    <p-menu #menu [model]="items()" [popup]="true" appendTo="body" />
  }
}
