<button
  type="button"
  class="user-menu-button"
  [class.user-menu-top]="variant() === 'top'"
  [class.user-menu-compact]="compact()"
  [attr.aria-label]="'layout.topbar.profile' | t"
  [attr.title]="compact() ? displayName() : null"
  aria-haspopup="true"
  (click)="menu.toggle($event)"
>
  <span class="user-menu-avatar" aria-hidden="true">
    <svg class="layout-stroke-icon" viewBox="0 0 24 24" width="18" height="18">
      <path d="M20 21a8 8 0 0 0-16 0M12 13a5 5 0 1 0 0-10 5 5 0 0 0 0 10z" />
    </svg>
  </span>
  @if (!compact()) {
    <span class="user-menu-text">
      <span class="user-menu-name">{{ displayName() }}</span>
      <span class="user-menu-role">{{ 'layout.user.role' | t }}</span>
    </span>
    <svg
      class="layout-stroke-icon user-menu-chevron"
      viewBox="0 0 24 24"
      width="16"
      height="16"
      aria-hidden="true"
    >
      <path [attr.d]="chevronPath()" />
    </svg>
  }
</button>
<p-menu #menu [model]="items()" [popup]="true" appendTo="body" styleClass="user-menu-panel">
  <ng-template #start>
    <div class="user-menu-head">
      <span class="user-menu-caption">{{ 'layout.user.signedInAs' | t }}</span>
      <span class="user-menu-head-name">{{ displayName() }}</span>
    </div>
  </ng-template>
</p-menu>
