<div class="flex flex-col gap-4">
  <app-style-picker [activeId]="activeStyleId()" (picked)="selectStyle($event)" />

  <app-swatch-picker
    label="layout.configurator.primary"
    [swatches]="primarySwatches"
    [selected]="config().primary"
    (picked)="selectPrimary($event)"
  />

  <app-swatch-picker
    label="layout.configurator.surface"
    [swatches]="surfaceSwatches"
    [selected]="selectedSurface()"
    (picked)="selectSurface($event)"
  />

  <app-swatch-picker
    label="layout.configurator.ground"
    [swatches]="groundSwatches()"
    [strongSwatches]="strongGroundSwatches()"
    [selected]="config().ground"
    [allowDefault]="true"
    [matte]="config().groundMatte"
    matteId="layout-ground-matte"
    (matteChange)="selectGroundMatte($event)"
    (picked)="selectGround($event)"
  />

  @if (showCardColor()) {
    <app-swatch-picker
      label="layout.configurator.card"
      [swatches]="cardSwatches()"
      [strongSwatches]="strongCardSwatches()"
      [selected]="config().card"
      [allowDefault]="true"
      [matte]="config().cardMatte"
      matteId="layout-card-matte"
      (matteChange)="selectCardMatte($event)"
      (picked)="selectCard($event)"
    />
  }

  <div class="flex flex-col gap-2">
    <span class="text-sm text-muted-color font-semibold">{{
      'layout.configurator.preset' | t
    }}</span>
    <p-selectbutton
      [options]="presetOptions"
      [ngModel]="config().preset"
      (ngModelChange)="selectPreset($event)"
      [allowEmpty]="false"
      size="small"
    />
  </div>
</div>
