<div class="layout-topbar">
  <div class="topbar-left">
    <button
      type="button"
      class="menu-button layout-menu-button"
      [attr.aria-label]="'layout.topbar.toggleMenu' | t"
      (click)="layoutService.toggleMenu()"
    >
      <i class="pi pi-chevron-left menu-button-collapse"></i>
      <i class="pi pi-bars menu-button-open"></i>
    </button>
    <span class="topbar-separator"></span>
    <app-breadcrumb />
    <a class="mobile-logo" [routerLink]="dashboardPath">
      <app-logo class="h-8" />
    </a>
  </div>

  <div class="topbar-right">
    <app-theme-switcher />
    <app-language-switcher />

    <button
      type="button"
      class="layout-topbar-action"
      [attr.aria-label]="'layout.topbar.profile' | t"
      aria-haspopup="true"
      (click)="profileMenu.toggle($event)"
    >
      <i class="pi pi-user"></i>
    </button>
    <p-menu #profileMenu [model]="profileMenuItems()" [popup]="true" appendTo="body" />
  </div>
</div>
