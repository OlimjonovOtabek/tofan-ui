<div class="mb-4 flex flex-wrap items-start gap-3">
  <div class="flex min-w-64 flex-1 flex-col gap-1">
    <label for="paymentOrderSearch" class="text-muted-color text-sm">{{
      'paymentOrders.filters.search' | t
    }}</label>
    <input
      pInputText
      id="paymentOrderSearch"
      type="search"
      [formField]="form.search"
      [placeholder]="'paymentOrders.filters.searchPlaceholder' | t"
    />
  </div>

  <div class="flex min-w-40 flex-col gap-1">
    <label for="paymentOrderStatus" class="text-muted-color text-sm">{{
      'paymentOrders.filters.status' | t
    }}</label>
    <app-select-field
      inputId="paymentOrderStatus"
      [formField]="form.status"
      [options]="statusOptions()"
      [placeholder]="'paymentOrders.filters.all' | t"
      [showClear]="true"
    />
  </div>

  <div class="flex min-w-44 flex-col gap-1">
    <label for="paymentOrderPurpose" class="text-muted-color text-sm">{{
      'paymentOrders.filters.purpose' | t
    }}</label>
    <app-select-field
      inputId="paymentOrderPurpose"
      [formField]="form.purpose"
      [options]="purposeOptions()"
      [placeholder]="'paymentOrders.filters.all' | t"
      [showClear]="true"
    />
  </div>

  <div class="flex min-w-44 flex-col gap-1">
    <label for="paymentOrderTrainer" class="text-muted-color text-sm">{{
      'paymentOrders.filters.trainer' | t
    }}</label>
    <app-select-field
      inputId="paymentOrderTrainer"
      [formField]="form.trainerId"
      [options]="trainerOptions()"
      [placeholder]="'paymentOrders.filters.all' | t"
      [showClear]="true"
    />
  </div>

  <div class="flex min-w-36 flex-col gap-1">
    <label for="paymentOrderProvider" class="text-muted-color text-sm">{{
      'paymentOrders.filters.provider' | t
    }}</label>
    <app-select-field
      inputId="paymentOrderProvider"
      [formField]="form.paidWith"
      [options]="providerOptions()"
      [placeholder]="'paymentOrders.filters.all' | t"
      [showClear]="true"
    />
  </div>

  <div class="flex min-w-56 flex-col gap-1">
    <label for="paymentOrderCreated" class="text-muted-color text-sm">{{
      'paymentOrders.filters.created' | t
    }}</label>
    <app-date-range-field
      inputId="paymentOrderCreated"
      [formField]="form.created"
      [maxDate]="today"
      [placeholder]="'paymentOrders.filters.createdPlaceholder' | t"
    />
  </div>

  <p-button
    class="self-end"
    [label]="'common.actions.clear' | t"
    icon="pi pi-filter-slash"
    severity="secondary"
    [text]="true"
    (onClick)="reset()"
  />
</div>
