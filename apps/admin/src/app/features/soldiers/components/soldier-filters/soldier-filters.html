<form [formGroup]="form" class="mb-4 flex flex-wrap items-end gap-3">
  <div class="flex min-w-56 flex-1 flex-col gap-1">
    <label for="soldierSearch" class="text-muted-color text-sm">{{
      'soldiers.filters.search' | t
    }}</label>
    <input
      pInputText
      id="soldierSearch"
      type="search"
      formControlName="search"
      [placeholder]="'soldiers.filters.searchPlaceholder' | t"
    />
  </div>

  <div class="flex min-w-36 flex-col gap-1">
    <label for="soldierGender" class="text-muted-color text-sm">{{
      'soldiers.filters.gender' | t
    }}</label>
    <p-select
      [fluid]="true"
      inputId="soldierGender"
      formControlName="gender"
      [options]="genderOptions()"
      optionLabel="label"
      optionValue="value"
      [placeholder]="'soldiers.filters.all' | t"
      [showClear]="true"
    />
  </div>

  <div class="flex min-w-36 flex-col gap-1">
    <label for="soldierGoal" class="text-muted-color text-sm">{{
      'soldiers.filters.goal' | t
    }}</label>
    <p-select
      [fluid]="true"
      inputId="soldierGoal"
      formControlName="goal"
      [options]="goalOptions()"
      optionLabel="label"
      optionValue="value"
      [placeholder]="'soldiers.filters.all' | t"
      [showClear]="true"
    />
  </div>

  <div class="flex min-w-36 flex-col gap-1">
    <label for="soldierExperience" class="text-muted-color text-sm">{{
      'soldiers.filters.experience' | t
    }}</label>
    <p-select
      [fluid]="true"
      inputId="soldierExperience"
      formControlName="experienceLevel"
      [options]="experienceOptions()"
      optionLabel="label"
      optionValue="value"
      [placeholder]="'soldiers.filters.all' | t"
      [showClear]="true"
    />
  </div>

  <div class="flex min-w-36 flex-col gap-1">
    <label for="soldierPlace" class="text-muted-color text-sm">{{
      'soldiers.filters.place' | t
    }}</label>
    <p-select
      [fluid]="true"
      inputId="soldierPlace"
      formControlName="isHomeWorkout"
      [options]="placeOptions()"
      optionLabel="label"
      optionValue="value"
      [placeholder]="'soldiers.filters.all' | t"
      [showClear]="true"
    />
  </div>

  <div class="flex flex-col gap-1">
    <label for="soldierJoined" class="text-muted-color text-sm">{{
      'soldiers.filters.joined' | t
    }}</label>
    <p-datepicker
      inputId="soldierJoined"
      formControlName="joined"
      selectionMode="range"
      [readonlyInput]="true"
      [showButtonBar]="true"
      [maxDate]="today"
      [placeholder]="'soldiers.filters.joinedPlaceholder' | t"
    />
  </div>

  <p-button
    [label]="'soldiers.filters.clear' | t"
    icon="pi pi-filter-slash"
    severity="secondary"
    [text]="true"
    (onClick)="reset()"
  />
</form>
