<section
  class="border-surface-200 dark:border-surface-700 flex flex-col gap-3 rounded-xl border p-4"
  aria-labelledby="platformFeeSampleTitle"
>
  <header class="flex flex-col gap-1">
    <h2 id="platformFeeSampleTitle" class="m-0 text-base font-semibold">
      {{ 'platformFee.sample.title' | t }}
    </h2>
    <small class="text-muted-color">{{ 'platformFee.sample.hint' | t }}</small>
  </header>

  <dl class="m-0 flex flex-col gap-2">
    @for (row of rows(); track row.label) {
      <div class="flex items-baseline justify-between gap-3">
        <dt class="text-muted-color">{{ row.label | t: row.params }}</dt>
        <dd class="m-0 text-right tabular-nums">{{ row.amount }}</dd>
      </div>
    }
    <div
      class="border-surface-200 dark:border-surface-700 flex items-baseline justify-between gap-3 border-t pt-2"
    >
      <dt class="font-semibold">{{ 'platformFee.sample.total' | t }}</dt>
      <dd class="m-0 text-right font-semibold tabular-nums">{{ total() }}</dd>
    </div>
  </dl>
</section>
