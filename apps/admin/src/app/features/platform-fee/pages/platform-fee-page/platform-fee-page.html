<div class="mb-6">
  <h1 class="text-surface-900 dark:text-surface-0 m-0 text-xl font-semibold">
    {{ 'platformFee.title' | t }}
  </h1>
  <span class="text-muted-color text-sm">{{ 'platformFee.subtitle' | t }}</span>
</div>

@if (store.loadError(); as error) {
  <p-message severity="error">
    <div class="flex flex-wrap items-center gap-3">
      <span>{{ error | message }}</span>
      <p-button
        [label]="'common.actions.retry' | t"
        icon="pi pi-refresh"
        severity="secondary"
        [outlined]="true"
        size="small"
        (onClick)="store.load()"
      />
    </div>
  </p-message>
} @else if (store.fee(); as fee) {
  <app-platform-fee-form [fee]="fee" [saving]="store.saving()" (save)="save($event)" />
} @else if (store.loading()) {
  <p class="text-muted-color m-0">
    <i class="pi pi-spin pi-spinner mr-2"></i>{{ 'platformFee.loading' | t }}
  </p>
}
