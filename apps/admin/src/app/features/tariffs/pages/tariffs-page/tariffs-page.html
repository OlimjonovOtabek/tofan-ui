<div class="card">
  <app-catalog-header [title]="'tariffs.page.title' | t" [subtitle]="'tariffs.page.subtitle' | t" />

  @if (store.loadError(); as error) {
    <p-message severity="error">
      <div class="flex flex-wrap items-center gap-3">
        <span>{{ error | message }}</span>
        <p-button
          [label]="'common.actions.retry' | t"
          icon="pi pi-refresh"
          severity="secondary"
          [outlined]="true"
          size="small"
          (onClick)="store.load()"
        />
      </div>
    </p-message>
  } @else if (store.loading() && store.tariffs().length === 0) {
    <p class="text-muted-color m-0">{{ 'tariffs.page.loading' | t }}</p>
  } @else if (store.tariffs().length === 0) {
    <p class="text-muted-color m-0">{{ 'tariffs.page.empty' | t }}</p>
  }

  <div class="grid grid-cols-1 gap-4 lg:grid-cols-3">
    @for (tariff of store.tariffs(); track tariff.id) {
      <app-tariff-card
        [tariff]="tariff"
        (edit)="edit(tariff)"
        (editBenefits)="editBenefits(tariff)"
      />
    }
  </div>
</div>

<app-tariff-form-dialog
  [(visible)]="formVisible"
  [tariff]="editing()"
  [saving]="store.saving()"
  (save)="save($event)"
/>

<app-benefits-dialog
  [(visible)]="benefitsVisible"
  [header]="benefitsHeader()"
  [benefits]="editingBenefits()"
  [saving]="store.saving()"
  (save)="saveBenefits($event)"
/>
