<div class="mb-4 flex flex-wrap items-start gap-3">
  <div class="flex min-w-64 flex-1 flex-col gap-1">
    <label for="subscriptionSearch" class="text-muted-color text-sm">{{
      'trainers.filters.search' | t
    }}</label>
    <input
      pInputText
      id="subscriptionSearch"
      type="search"
      [formField]="form.search"
      [placeholder]="'trainers.filters.searchPlaceholder' | t"
    />
  </div>

  <div class="flex min-w-56 flex-col gap-1">
    <label for="subscriptionTrainer" class="text-muted-color text-sm">{{
      'trainers.filters.trainer' | t
    }}</label>
    <app-select-field
      inputId="subscriptionTrainer"
      [formField]="form.trainerId"
      [options]="trainerOptions()"
      [placeholder]="'trainers.filters.all' | t"
      [showClear]="true"
    />
  </div>

  <div class="flex min-w-40 flex-col gap-1">
    <label for="subscriptionStatus" class="text-muted-color text-sm">{{
      'trainers.filters.status' | t
    }}</label>
    <app-select-field
      inputId="subscriptionStatus"
      [formField]="form.status"
      [options]="statusOptions()"
      [placeholder]="'trainers.filters.all' | t"
      [showClear]="true"
    />
  </div>

  <div class="flex min-w-36 flex-col gap-1">
    <label for="subscriptionTier" class="text-muted-color text-sm">{{
      'trainers.filters.tier' | t
    }}</label>
    <app-select-field
      inputId="subscriptionTier"
      [formField]="form.tier"
      [options]="tierOptions()"
      [placeholder]="'trainers.filters.all' | t"
      [showClear]="true"
    />
  </div>

  <label for="subscriptionEndingSoon" class="flex items-center gap-2 self-end py-2 text-sm">
    <app-toggle-field inputId="subscriptionEndingSoon" [formField]="form.endingSoon" />
    {{ 'trainers.filters.endingSoon' | t }}
  </label>

  <p-button
    class="self-end"
    [label]="'common.actions.clear' | t"
    icon="pi pi-filter-slash"
    severity="secondary"
    [text]="true"
    (onClick)="reset()"
  />
</div>
