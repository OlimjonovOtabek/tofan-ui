<p-button
  icon="pi pi-pencil"
  severity="secondary"
  [text]="true"
  [rounded]="true"
  [ariaLabel]="'trainers.list.actions.edit' | t"
  [pTooltip]="'trainers.list.actions.edit' | t"
  (onClick)="edit.emit()"
/>
<p-button
  icon="pi pi-key"
  severity="secondary"
  [text]="true"
  [rounded]="true"
  [ariaLabel]="'trainers.list.actions.password' | t"
  [pTooltip]="'trainers.list.actions.password' | t"
  (onClick)="changePassword.emit()"
/>
<p-button
  icon="pi pi-percentage"
  severity="secondary"
  [text]="true"
  [rounded]="true"
  [ariaLabel]="'trainers.list.actions.commission' | t"
  [pTooltip]="'trainers.list.actions.commission' | t"
  (onClick)="changeCommission.emit()"
/>
<p-button
  icon="pi pi-user-plus"
  severity="secondary"
  [text]="true"
  [rounded]="true"
  [ariaLabel]="'trainers.list.actions.grant' | t"
  [pTooltip]="'trainers.list.actions.grant' | t"
  (onClick)="grant.emit()"
/>
@if (trainer().isPublished) {
  <p-button
    icon="pi pi-eye-slash"
    severity="secondary"
    [text]="true"
    [rounded]="true"
    [ariaLabel]="'trainers.list.actions.unpublish' | t"
    [pTooltip]="'trainers.list.actions.unpublish' | t"
    (onClick)="unpublish.emit()"
  />
} @else {
  <p-button
    icon="pi pi-eye"
    severity="secondary"
    [text]="true"
    [rounded]="true"
    [ariaLabel]="'trainers.list.actions.publish' | t"
    [pTooltip]="'trainers.list.actions.publish' | t"
    (onClick)="publish.emit()"
  />
  <p-button
    icon="pi pi-trash"
    severity="danger"
    [text]="true"
    [rounded]="true"
    [ariaLabel]="'trainers.list.actions.delete' | t"
    [pTooltip]="'trainers.list.actions.delete' | t"
    (onClick)="remove.emit()"
  />
}
