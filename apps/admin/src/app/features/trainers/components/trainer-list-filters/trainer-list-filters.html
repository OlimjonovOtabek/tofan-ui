<div class="mb-4 flex flex-wrap items-start gap-3">
  <div class="flex min-w-64 flex-1 flex-col gap-1">
    <label for="trainerSearch" class="text-muted-color text-sm">{{
      'trainers.listFilters.search' | t
    }}</label>
    <input
      pInputText
      id="trainerSearch"
      type="search"
      [formField]="form.search"
      [placeholder]="'trainers.listFilters.searchPlaceholder' | t"
    />
  </div>

  <div class="flex min-w-48 flex-col gap-1">
    <label for="trainerPublishState" class="text-muted-color text-sm">{{
      'trainers.listFilters.status' | t
    }}</label>
    <app-select-field
      inputId="trainerPublishState"
      [formField]="form.publishState"
      [options]="publishOptions()"
      [placeholder]="'trainers.filters.all' | t"
      [showClear]="true"
    />
  </div>

  <p-button
    class="self-end"
    [label]="'common.actions.clear' | t"
    icon="pi pi-filter-slash"
    severity="secondary"
    [text]="true"
    (onClick)="reset()"
  />
</div>
