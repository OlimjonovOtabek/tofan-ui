<section
  class="border-surface-200 dark:border-surface-700 flex h-full flex-col gap-4 rounded-xl border p-4"
>
  <div class="flex flex-wrap items-center justify-between gap-3">
    <h2 class="text-surface-900 dark:text-surface-0 m-0 text-lg font-semibold">
      {{ label() | t }}
    </h2>
    <p-button
      [label]="'trainers.tiers.edit' | t"
      icon="pi pi-list"
      severity="secondary"
      [outlined]="true"
      size="small"
      (onClick)="edit.emit()"
    />
  </div>

  @if (benefits().length === 0) {
    <p class="text-muted-color m-0 text-sm">{{ 'trainers.tiers.empty' | t }}</p>
  } @else {
    <ul class="m-0 flex list-none flex-col gap-2 p-0">
      @for (benefit of benefits(); track $index) {
        <li class="flex items-start gap-2">
          <i class="pi pi-check-circle text-primary mt-1" aria-hidden="true"></i>
          <span>{{ benefit }}</span>
        </li>
      }
    </ul>
  }
</section>
