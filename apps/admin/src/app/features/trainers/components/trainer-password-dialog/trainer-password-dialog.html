<app-form-dialog [(visible)]="visible" [header]="header()" [saving]="saving()" (save)="submit()">
  <div class="flex flex-col gap-1">
    <label for="trainerNewPassword" class="font-medium">{{ 'trainers.password.label' | t }}</label>
    <app-password-field
      inputId="trainerNewPassword"
      autocomplete="new-password"
      [formField]="form.password"
    />
    <app-field-error [field]="form.password()" />
    <small class="text-muted-color">{{ 'trainers.password.hint' | t }}</small>
  </div>
</app-form-dialog>
