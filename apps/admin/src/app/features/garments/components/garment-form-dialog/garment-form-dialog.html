<app-form-dialog
  [(visible)]="visible"
  [header]="'garments.form.header' | t"
  [saveLabel]="'garments.form.save' | t"
  [cancelLabel]="'garments.form.close' | t"
  [saving]="saving()"
  width="52rem"
  (save)="submit()"
>
  <div class="flex flex-col gap-6">
    @if (created(); as garment) {
      <app-garment-created-panel [garment]="garment" />
    }

    <div class="grid grid-cols-1 gap-x-6 gap-y-5 md:grid-cols-2">
      <div class="flex flex-col gap-2">
        <label for="model" class="font-medium">{{ 'garments.form.model' | t }}</label>
        <app-text-field
          inputId="model"
          autocomplete="off"
          [formField]="form.model"
          [placeholder]="'garments.form.modelPlaceholder' | t"
        />
        <app-field-error [field]="form.model()" />
      </div>

      <div class="flex flex-col gap-2">
        <label for="manufacturedAt" class="font-medium">{{
          'garments.form.manufacturedAt' | t
        }}</label>
        <app-date-field inputId="manufacturedAt" [formField]="form.manufacturedAt" [fluid]="true" />
        <app-field-error [field]="form.manufacturedAt()" />
      </div>

      <div class="flex flex-col gap-2">
        <label for="color" class="font-medium">{{ 'garments.form.color' | t }}</label>
        <app-color-field inputId="color" [formField]="form.color" />
        <app-field-error [field]="form.color()" />
      </div>

      <div class="flex flex-col gap-2">
        <label for="material" class="font-medium">
          {{ 'garments.form.material' | t }}
          <span class="text-muted-color font-normal">{{ 'garments.form.optional' | t }}</span>
        </label>
        <app-text-field
          inputId="material"
          [formField]="form.material"
          [placeholder]="'garments.form.materialPlaceholder' | t"
        />
        <app-field-error [field]="form.material()" />
      </div>

      <div class="flex flex-col gap-2 md:col-span-2">
        <span id="sizeLabel" class="font-medium">{{ 'garments.form.size' | t }}</span>
        <app-choice-field
          ariaLabelledBy="sizeLabel"
          [formField]="form.size"
          [options]="sizeOptions"
          [fluid]="true"
        />
        <app-field-error [field]="form.size()" />
      </div>
    </div>
  </div>
</app-form-dialog>
