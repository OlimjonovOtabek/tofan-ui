<div class="card">
  <div class="mb-4 flex flex-wrap items-center justify-between gap-3">
    <div>
      <h1 class="text-surface-900 dark:text-surface-0 m-0 text-xl font-semibold">
        {{ 'notifications.templates.title' | t }}
      </h1>
      <span class="text-muted-color text-sm">
        {{
          'notifications.templates.total'
            | t: { count: store.loadError() === null ? store.totalCount() : '—' }
        }}
      </span>
    </div>
    <p-button [label]="'notifications.templates.add' | t" icon="pi pi-plus" (onClick)="add()" />
  </div>

  <app-data-table
    [columns]="columns()"
    [items]="store.templates()"
    [totalCount]="store.totalCount()"
    [loading]="store.loading()"
    [error]="store.loadError()"
    [first]="store.first()"
    [emptyMessage]="'notifications.templates.empty' | t"
    (pageChange)="loadPage($event)"
    (retry)="store.load()"
  >
    <ng-template #row let-template>
      <tr>
        <td class="whitespace-nowrap">{{ typeLabel(template) }}</td>
        <td class="whitespace-nowrap">{{ styleLabel(template) }}</td>
        <td>
          <div class="font-medium">{{ template.titleIn(locale()) }}</div>
          <div class="text-muted-color line-clamp-2 text-sm">{{ template.bodyIn(locale()) }}</div>
        </td>
        <td>
          <p-tag
            [value]="
              (template.isActive
                ? 'notifications.templates.active'
                : 'notifications.templates.inactive'
              ) | t
            "
            [severity]="template.isActive ? 'success' : 'secondary'"
          />
        </td>
        <td class="text-muted-color whitespace-nowrap text-sm">
          {{ updatedLabel(template) }}
        </td>
        <td class="text-right whitespace-nowrap">
          <p-button
            icon="pi pi-pencil"
            severity="secondary"
            [text]="true"
            [rounded]="true"
            [ariaLabel]="'common.actions.edit' | t"
            (onClick)="edit(template)"
          />
          <p-button
            icon="pi pi-trash"
            severity="danger"
            [text]="true"
            [rounded]="true"
            [ariaLabel]="'common.actions.delete' | t"
            (onClick)="remove(template)"
          />
        </td>
      </tr>
    </ng-template>
  </app-data-table>
</div>

<app-notification-template-form-dialog
  [(visible)]="dialogVisible"
  [template]="editedTemplate()"
  [saving]="store.saving()"
  (save)="saveDraft($event)"
/>
