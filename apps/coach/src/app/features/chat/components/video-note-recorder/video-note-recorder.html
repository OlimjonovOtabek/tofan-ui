<dialog
  #dialog
  class="overlay"
  tabindex="-1"
  [attr.aria-label]="'coachApp.conversation.videoNoteRecording' | t"
  (cancel)="escaped($event)"
>
  <div class="circle">
    <video #preview class="preview" autoplay playsinline [muted]="true"></video>
    <svg class="progress-ring" [attr.viewBox]="ring.viewBox" aria-hidden="true">
      <circle
        class="track"
        [attr.cx]="ring.center"
        [attr.cy]="ring.center"
        [attr.r]="ring.radius"
      />
      <circle
        class="done"
        [attr.cx]="ring.center"
        [attr.cy]="ring.center"
        [attr.r]="ring.radius"
        [attr.stroke-dasharray]="ring.length"
        [attr.stroke-dashoffset]="ringOffset()"
      />
    </svg>
  </div>
  <span class="clock t-base3 font-semibold">
    <span class="dot" aria-hidden="true"></span>
    {{ clock() }}
  </span>
  <div class="actions">
    <button
      type="button"
      class="cancel"
      [attr.aria-label]="'coachApp.conversation.recordCancel' | t"
      (click)="cancelled.emit()"
    >
      <coach-icon name="trash" />
    </button>
    <button
      type="button"
      class="send"
      [attr.aria-label]="'coachApp.conversation.videoNoteSend' | t"
      (click)="sent.emit()"
    >
      <coach-icon name="arrow-up" />
    </button>
  </div>
</dialog>
