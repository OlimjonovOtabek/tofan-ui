<main class="page">
  <div class="panel">
    <coach-brand-logo />
    <h1 class="t-title1 title">{{ 'coachApp.signIn.title' | t }}</h1>
    <p class="t-base1 tone-secondary">{{ 'coachApp.signIn.subtitle' | t }}</p>
    <form class="form" [formRoot]="signInForm">
      <coach-text-field
        [formField]="signInForm.identifier"
        [title]="'coachApp.signIn.identifier' | t"
        [hint]="'coachApp.signIn.identifierRequired' | t"
        autocomplete="username"
      />
      <coach-text-field
        [formField]="signInForm.password"
        type="password"
        [title]="'coachApp.signIn.password' | t"
        [hint]="'coachApp.signIn.passwordHint' | t"
        autocomplete="current-password"
      />
      <a class="forgot t-base4 tone-secondary" [href]="supportUrl" target="_blank" rel="noopener">
        {{ 'coachApp.signIn.forgot' | t }}
      </a>
      <div class="remember">
        <span class="t-base3">{{ 'coachApp.signIn.remember' | t }}</span>
        <coach-switch
          [formField]="signInForm.remember"
          [ariaLabel]="'coachApp.signIn.remember' | t"
        />
      </div>
      <button coachButton="primary" type="submit" class="submit" [loading]="store.signingIn()">
        {{ 'coachApp.signIn.submit' | t }}
      </button>
    </form>
  </div>
</main>
