@if (error(); as failure) {
  <div class="block-state" role="alert">
    <span class="state-icon failed"><i class="pi pi-info-circle" aria-hidden="true"></i></span>
    <h3>{{ 'coach.clients.blockFailed' | t }}</h3>
    <p>{{ failure | message }}</p>
    <p>{{ 'coach.clients.blockFailedHint' | t }}</p>
    <button pButton type="button" severity="secondary" [outlined]="true" (click)="retry.emit()">
      <i class="pi pi-refresh" aria-hidden="true"></i>{{ 'coach.clients.retry' | t }}
    </button>
  </div>
} @else {
  <div class="block-state">
    <span class="state-icon"><i [class]="icon()" aria-hidden="true"></i></span>
    <h3>{{ title() | t }}</h3>
    <p>{{ hint() | t }}</p>
  </div>
}
