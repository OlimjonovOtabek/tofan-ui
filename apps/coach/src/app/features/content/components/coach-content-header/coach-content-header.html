<section class="content-heading">
  <div class="content-title-row">
    <div>
      <h1>{{ 'coach.content.pageTitle' | t }}</h1>
      <p>{{ 'coach.content.pageDescription' | t }}</p>
    </div>
    <button pButton type="button" class="primary-button" [loading]="busy()" (click)="create.emit()">
      <i class="pi pi-plus" aria-hidden="true"></i>{{ createLabel() | t }}
    </button>
  </div>
  <nav class="content-tabs" [attr.aria-label]="'coach.content.pageTitle' | t">
    <a routerLink="/content/exercises" routerLinkActive="active" ariaCurrentWhenActive="page">{{
      'coach.content.exercises' | t
    }}</a>
    <a routerLink="/content/foods" routerLinkActive="active" ariaCurrentWhenActive="page">{{
      'coach.content.foods' | t
    }}</a>
  </nav>
</section>
