<div class="save-bar">
  <span class="save-status" [class.dirty]="dirty()" role="status">
    <i class="status-dot" aria-hidden="true"></i>
    {{
      saving()
        ? ('coach.profile.saving' | t)
        : dirty()
          ? ('coach.workspace.dirtyState' | t)
          : ('coach.workspace.saveState' | t)
    }}
  </span>
  <div class="save-actions">
    <button pButton type="button" severity="secondary" [text]="true" [disabled]="!dirty() || saving()" (click)="discardRequested.emit()">
      {{ 'coach.workspace.discardChanges' | t }}
    </button>
    <button pButton type="button" [loading]="saving()" [disabled]="saving() || !dirty()" (click)="saveRequested.emit()">
      <i class="pi pi-check" aria-hidden="true"></i>{{ saving() ? ('coach.profile.saving' | t) : ('common.actions.save' | t) }}
    </button>
  </div>
</div>
