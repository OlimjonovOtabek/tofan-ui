<aside class="workspace-panel day-panel">
  <h2>{{ 'coach.workspace.backToDays' | t }}<span class="day-count">{{ days().length }}</span></h2>
  @for (day of days(); track day.key) {
    <button
      type="button"
      class="day-item"
      [class.active]="day.key === selectedKey()"
      [attr.aria-pressed]="day.key === selectedKey()"
      (click)="daySelected.emit(day.key)"
    >
      <span class="day-dot">{{ abbreviation(day) }}</span>
      <span class="day-info">
        <b>{{ day.title }}</b>
        <small
          >{{ weekday(day) }} ·
          {{
            day.isRestDay
              ? ('coach.programs.restDay' | t)
              : ('coach.workspace.exerciseCount' | t: { count: day.exercises.length })
          }}</small
        >
      </span>
      @if (saveStates().get(day.key); as state) {
        <span
          class="workspace-status"
          [class.published]="state === 'saved'"
          [class.failed]="state === 'failed'"
          role="status"
          >{{ (state === 'saved' ? 'coach.programs.daySaved' : 'coach.programs.dayFailed') | t }}</span
        >
      }
      <i class="pi pi-chevron-right" aria-hidden="true"></i>
    </button>
  }
  <button pButton type="button" severity="secondary" [text]="true" class="day-add" (click)="addRequested.emit()">
    <i class="pi pi-plus" aria-hidden="true"></i>{{ 'coach.programs.addDay' | t }}
  </button>
</aside>
