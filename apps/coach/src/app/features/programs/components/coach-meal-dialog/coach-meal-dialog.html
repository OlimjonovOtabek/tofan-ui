<p-dialog
  [closeAriaLabel]="'common.actions.cancel' | t"
  [header]="'coach.workspace.editMeal' | t"
  [visible]="meal() !== null"
  (visibleChange)="$event || closed.emit()"
  [modal]="true"
  [style]="{ width: '34rem' }"
  [breakpoints]="{ '760px': '95vw' }"
>
  <form class="meal-form" (submit)="$event.preventDefault(); submit()">
    <label for="mealDialogType">
      <span>{{ 'coach.programs.mealType' | t }}</span>
      <app-select-field
        inputId="mealDialogType"
        [value]="mealType()"
        (valueChange)="typeChanged($event)"
        [options]="typeOptions()"
        [fluid]="true"
        [ariaLabel]="'coach.programs.mealType' | t"
      />
    </label>
    <label for="mealDialogTitle">
      <span>{{ 'coach.programs.mealTitle' | t }}</span>
      <input id="mealDialogTitle" pInputText [value]="title()" (input)="titleChanged($event)" />
    </label>
    <label for="mealDialogTime">
      <span>{{ 'coach.programs.plannedTime' | t }}</span>
      <input id="mealDialogTime" pInputText type="time" [value]="plannedTime()" (input)="timeChanged($event)" />
    </label>
    <footer class="meal-form-actions">
      <button pButton type="button" severity="danger" [text]="true" (click)="removed.emit()">
        {{ 'coach.programs.removeMeal' | t }}
      </button>
      <button pButton type="button" severity="secondary" [outlined]="true" (click)="closed.emit()">
        {{ 'common.actions.cancel' | t }}
      </button>
      <button pButton type="submit">{{ 'common.actions.save' | t }}</button>
    </footer>
  </form>
</p-dialog>
