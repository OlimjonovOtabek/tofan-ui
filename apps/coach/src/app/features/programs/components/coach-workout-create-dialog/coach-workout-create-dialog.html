<p-dialog [closeAriaLabel]="'common.actions.cancel' | t" [header]="'coach.programs.createWorkoutTitle' | t" [visible]="true" (visibleChange)="closed.emit()" [modal]="true" [style]="{ width: '38rem' }" [breakpoints]="{ '760px': '95vw' }">
  <form class="program-editor" (submit)="$event.preventDefault(); submit()">
    <div class="editor-grid">
      <div class="editor-field field-wide"><label for="workoutName">{{ 'coach.programs.name' | t }}</label><app-text-field inputId="workoutName" [formField]="workoutForm.name" />@if (workoutForm.name().touched() && workoutForm.name().invalid()) { <small>{{ 'coach.programs.nameRequired' | t }}</small> }</div>
      <div class="editor-field"><label for="workoutGoal">{{ 'coach.programs.goal' | t }}</label><app-select-field [fluid]="true" inputId="workoutGoal" [formField]="workoutForm.goal" [options]="goalOptions()" [ariaLabel]="'coach.programs.goal' | t" /></div>
      <div class="editor-field"><label for="workoutExperience">{{ 'coach.programs.experience' | t }}</label><app-select-field [fluid]="true" inputId="workoutExperience" [formField]="workoutForm.experienceLevel" [options]="experienceOptions()" [ariaLabel]="'coach.programs.experience' | t" /></div>
      <label class="home-toggle" for="workoutIsHome"><app-toggle-field [formField]="workoutForm.isHomeWorkout" inputId="workoutIsHome" />{{ 'coach.programs.homeWorkout' | t }}</label>
    </div>
    <footer class="editor-actions"><button pButton severity="secondary" [outlined]="true" type="button" (click)="closed.emit()">{{ 'common.actions.cancel' | t }}</button><button pButton [loading]="saving()" type="submit" [disabled]="saving()">{{ saving() ? ('coach.profile.saving' | t) : ('common.actions.save' | t) }}</button></footer>
  </form>
</p-dialog>
