<div class="layout" [class.has-tabbar]="!pushed()">
  <aside class="sidebar">
    <a class="brand" routerLink="/dashboard"><coach-brand-logo /></a>
    <nav class="side-nav" [attr.aria-label]="'coachApp.nav.label' | t">
      @for (tab of tabs; track tab.path) {
        <a
          class="side-link"
          [routerLink]="tab.path"
          routerLinkActive="is-active"
          ariaCurrentWhenActive="page"
          #link="routerLinkActive"
        >
          <coach-icon [name]="link.isActive ? tab.activeIcon : tab.icon" />
          <span>{{ tab.label | t }}</span>
        </a>
      }
    </nav>
  </aside>
  <main class="main">
    <router-outlet />
  </main>
  @if (!pushed()) {
    <nav class="tabbar" [attr.aria-label]="'coachApp.nav.label' | t">
      @for (tab of tabs; track tab.path) {
        <a
          class="tab"
          [routerLink]="tab.path"
          routerLinkActive="is-active"
          ariaCurrentWhenActive="page"
          #link="routerLinkActive"
        >
          <coach-icon [name]="link.isActive ? tab.activeIcon : tab.icon" />
          <span class="coach-ellipsis">{{ tab.label | t }}</span>
        </a>
      }
    </nav>
  }
</div>
