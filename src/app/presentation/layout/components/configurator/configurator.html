<div class="flex flex-col gap-4">
  <div>
    <span class="text-sm text-muted-color font-semibold">Asosiy rang</span>
    <div class="pt-2 flex gap-2 flex-wrap justify-start">
      @for (palette of primaryPalettes(); track palette.name) {
        <button
          type="button"
          [title]="palette.name"
          [attr.aria-label]="palette.name"
          (click)="selectPrimary($event, palette)"
          [class.outline]="palette.name === config().primary"
          [class.outline-primary]="palette.name === config().primary"
          class="cursor-pointer w-5 h-5 rounded-full flex shrink-0 items-center justify-center outline-offset-1 shadow"
          [style.background-color]="swatchColor(palette)"
        ></button>
      }
    </div>
  </div>

  <div>
    <span class="text-sm text-muted-color font-semibold">Fon rangi</span>
    <div class="pt-2 flex gap-2 flex-wrap justify-start">
      @for (palette of surfacePalettes; track palette.name) {
        <button
          type="button"
          [title]="palette.name"
          [attr.aria-label]="palette.name"
          (click)="selectSurface($event, palette)"
          [class.outline]="palette.name === selectedSurface()"
          [class.outline-primary]="palette.name === selectedSurface()"
          class="cursor-pointer w-5 h-5 rounded-full flex shrink-0 items-center justify-center p-0 outline-offset-1"
          [style.background-color]="palette.palette[500]"
        ></button>
      }
    </div>
  </div>

  <div class="flex flex-col gap-2">
    <span class="text-sm text-muted-color font-semibold">Preset</span>
    <p-selectbutton
      [options]="presetOptions"
      [ngModel]="config().preset"
      (ngModelChange)="selectPreset($event)"
      [allowEmpty]="false"
      size="small"
    />
  </div>

  @if (showMenuMode()) {
    <div class="flex flex-col gap-2">
      <span class="text-sm text-muted-color font-semibold">Menyu rejimi</span>
      <p-selectbutton
        [options]="menuModeOptions"
        optionLabel="label"
        optionValue="value"
        [ngModel]="config().menuMode"
        (ngModelChange)="selectMenuMode($event)"
        [allowEmpty]="false"
        size="small"
      />
    </div>
  }
</div>
