<div class="flex flex-col gap-2" [formGroup]="group()">
  <span class="text-surface-900 dark:text-surface-0 font-medium">{{ label() }}</span>

  @for (language of languages; track language.control) {
    <div class="flex flex-col gap-1">
      <div class="flex items-center gap-2">
        <span
          class="bg-surface-100 dark:bg-surface-800 text-muted-color w-10 rounded py-2 text-center text-xs font-semibold"
        >
          {{ language.code }}
        </span>
        <input
          pInputText
          type="text"
          class="flex-1"
          [id]="'localized-' + language.control"
          [formControlName]="language.control"
          [placeholder]="label() + ' (' + language.hint + ')'"
          [invalid]="isInvalid(language.control)"
        />
      </div>
      @if (isInvalid(language.control)) {
        <small class="text-red-500">{{ label() }} ({{ language.hint }}) kiritilishi shart</small>
      }
    </div>
  }
</div>
