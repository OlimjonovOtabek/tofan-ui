<div class="flex flex-col gap-2">
  <label class="text-surface-900 dark:text-surface-0 font-medium" [attr.for]="'file-' + label()">
    {{ label() }}
  </label>

  @if (uploading()) {
    <p-progressbar [value]="progress()" />
  } @else if (fileId(); as id) {
    <div
      class="border-surface-200 dark:border-surface-700 flex items-center gap-2 rounded border p-2"
    >
      <i class="pi pi-paperclip text-muted-color"></i>
      <span class="flex-1 truncate">{{ fileName() ?? id }}</span>
      <p-button
        icon="pi pi-times"
        severity="danger"
        [text]="true"
        [rounded]="true"
        ariaLabel="Faylni olib tashlash"
        (onClick)="detach()"
      />
    </div>
  } @else {
    <div class="flex items-center gap-3">
      <input
        type="file"
        class="hidden"
        [id]="'file-' + label()"
        [accept]="accept()"
        (change)="choose($event)"
      />
      <label
        [attr.for]="'file-' + label()"
        class="p-button p-button-outlined cursor-pointer"
        tabindex="0"
      >
        <i class="pi pi-upload mr-2"></i>
        Fayl tanlash
      </label>
      <small class="text-muted-color">{{ accept() }} · {{ maxSizeLabel() }}</small>
    </div>
  }
</div>
