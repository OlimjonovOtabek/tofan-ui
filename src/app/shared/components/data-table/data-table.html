<p-table
  [value]="value()"
  [lazy]="true"
  [loading]="loading()"
  [paginator]="true"
  [rows]="pageSize()"
  [first]="first()"
  [totalRecords]="totalCount()"
  [rowsPerPageOptions]="rowsPerPageOptions"
  [dataKey]="dataKey()"
  [sortField]="defaultSortField()"
  [sortOrder]="defaultSortOrder()"
  [showCurrentPageReport]="true"
  [currentPageReportTemplate]="'common.table.pageReport' | t"
  [rowHover]="true"
  (onLazyLoad)="onLazyLoad($event)"
>
  <ng-template #header>
    <tr>
      @for (column of columns(); track column.field) {
        <th
          [style.width]="column.width"
          [pSortableColumn]="column.sortable ? column.field : ''"
          [pSortableColumnDisabled]="!column.sortable"
        >
          {{ column.header }}
          @if (column.sortable) {
            <p-sortIcon [field]="column.field" />
          }
        </th>
      }
    </tr>
  </ng-template>

  <ng-template #body let-item>
    <ng-container
      [ngTemplateOutlet]="rowTemplate()"
      [ngTemplateOutletContext]="{ $implicit: item }"
    />
  </ng-template>

  <ng-template #emptymessage>
    <tr>
      <td [attr.colspan]="columns().length" class="py-8 text-center">
        @if (error(); as message) {
          <div class="flex flex-col items-center gap-3" role="alert">
            <span class="text-red-500">
              <i class="pi pi-exclamation-triangle mr-2" aria-hidden="true"></i
              >{{ message | message }}
            </span>
            <p-button
              [label]="'common.actions.retry' | t"
              icon="pi pi-refresh"
              severity="secondary"
              [outlined]="true"
              (onClick)="retry.emit()"
            />
          </div>
        } @else {
          <span class="text-muted-color">{{ emptyMessage() ?? ('common.table.empty' | t) }}</span>
        }
      </td>
    </tr>
  </ng-template>
</p-table>
