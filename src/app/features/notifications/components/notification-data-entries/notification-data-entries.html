<div class="flex flex-col gap-2">
  <div class="flex items-center justify-between">
    <div>
      <span class="font-medium">{{ 'notifications.data.title' | t }}</span>
      <div class="text-muted-color text-sm">
        {{ 'notifications.data.hint' | t }}
      </div>
    </div>
    <p-button
      [label]="'notifications.data.addRow' | t"
      icon="pi pi-plus"
      severity="secondary"
      [text]="true"
      (onClick)="add()"
    />
  </div>

  @for (entry of entries().controls; track entry; let index = $index) {
    <div class="flex items-center gap-2" [formGroup]="entry">
      <input
        pInputText
        type="text"
        class="flex-1"
        formControlName="key"
        [placeholder]="'notifications.data.key' | t"
        [attr.aria-label]="'notifications.data.keyLabel' | t: { index: index + 1 }"
      />
      <input
        pInputText
        type="text"
        class="flex-1"
        formControlName="value"
        [placeholder]="'notifications.data.value' | t"
        [attr.aria-label]="'notifications.data.valueLabel' | t: { index: index + 1 }"
      />
      <p-button
        icon="pi pi-times"
        severity="secondary"
        [text]="true"
        [rounded]="true"
        [ariaLabel]="'notifications.data.removeRow' | t"
        (onClick)="remove(index)"
      />
    </div>
  }
</div>
