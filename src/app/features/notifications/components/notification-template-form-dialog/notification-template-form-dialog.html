<app-form-dialog
  [(visible)]="visible"
  [header]="title() | t"
  [saving]="saving()"
  width="44rem"
  (save)="submit()"
>
  <div [formGroup]="form" class="flex flex-col gap-4">
    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
      <div class="flex flex-col gap-1">
        <label for="templateType" class="font-medium">{{ 'notifications.form.type' | t }}</label>
        <p-select
          inputId="templateType"
          formControlName="type"
          [options]="typeOptions()"
          optionLabel="label"
          optionValue="value"
          [fluid]="true"
        />
      </div>
      <div class="flex flex-col gap-1">
        <label for="templateStyle" class="font-medium">{{ 'notifications.form.style' | t }}</label>
        <p-select
          inputId="templateStyle"
          formControlName="trainerStyle"
          [options]="styleOptions()"
          optionLabel="label"
          optionValue="value"
          [fluid]="true"
        />
      </div>
    </div>

    <app-localized-text-field
      [group]="titles"
      [label]="'notifications.form.title' | t"
      idPrefix="template-title"
      [maxLength]="titleMaxLength"
    />

    <app-localized-text-field
      [group]="bodies"
      [label]="'notifications.form.body' | t"
      idPrefix="template-body"
      [multiline]="true"
      [maxLength]="bodyMaxLength"
    />

    <div class="flex items-center gap-2">
      <p-toggleswitch inputId="templateActive" formControlName="isActive" />
      <label for="templateActive">{{ 'notifications.form.active' | t }}</label>
    </div>
  </div>
</app-form-dialog>
