<form [formGroup]="form" class="flex min-w-0 flex-1 flex-wrap items-end gap-3">
  <div class="flex min-w-56 flex-1 flex-col gap-1">
    <label for="search" class="text-muted-color text-sm">{{
      'foods.filters.searchLabel' | t
    }}</label>
    <input
      pInputText
      id="search"
      type="search"
      formControlName="search"
      [placeholder]="'foods.filters.searchPlaceholder' | t"
    />
  </div>

  <div class="flex min-w-36 flex-col gap-1">
    <label for="foodSource" class="text-muted-color text-sm">{{
      'foods.filters.source' | t
    }}</label>
    <p-select
      [fluid]="true"
      inputId="foodSource"
      formControlName="source"
      [options]="sourceOptions()"
      optionLabel="label"
      optionValue="value"
      [placeholder]="'foods.filters.all' | t"
      [showClear]="true"
    />
  </div>

  <div class="flex min-w-36 flex-col gap-1">
    <label for="foodActivity" class="text-muted-color text-sm">{{
      'foods.filters.activity' | t
    }}</label>
    <p-select
      [fluid]="true"
      inputId="foodActivity"
      formControlName="isActive"
      [options]="activityOptions()"
      optionLabel="label"
      optionValue="value"
    />
  </div>

  <div class="flex min-w-36 flex-col gap-1">
    <label for="foodVerification" class="text-muted-color text-sm">{{
      'foods.filters.verification' | t
    }}</label>
    <p-select
      [fluid]="true"
      inputId="foodVerification"
      formControlName="isVerified"
      [options]="verificationOptions()"
      optionLabel="label"
      optionValue="value"
      [placeholder]="'foods.filters.all' | t"
      [showClear]="true"
    />
  </div>

  <p-button
    [label]="'foods.filters.clear' | t"
    icon="pi pi-filter-slash"
    severity="secondary"
    [text]="true"
    (onClick)="reset()"
  />
</form>
