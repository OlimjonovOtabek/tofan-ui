<app-form-dialog
  [(visible)]="visible"
  [header]="title()"
  [saving]="saving()"
  width="42rem"
  (save)="submit()"
>
  <div [formGroup]="form" class="flex flex-col gap-4">
    <app-localized-text-field [group]="names" [label]="'foods.form.name' | t" />

    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
      <div class="flex flex-col gap-1">
        <label for="source" class="font-medium">{{ 'foods.form.source' | t }}</label>
        <p-select
          inputId="source"
          formControlName="source"
          [options]="sourceOptions()"
          optionLabel="label"
          optionValue="value"
          [fluid]="true"
        />
      </div>

      <div class="flex flex-col gap-1">
        <label for="barcode" class="font-medium">{{ 'foods.form.barcode' | t }}</label>
        <input
          pInputText
          id="barcode"
          type="text"
          formControlName="barcode"
          [placeholder]="'foods.form.barcodePlaceholder' | t"
        />
      </div>
    </div>

    <div class="grid grid-cols-1 gap-4 sm:grid-cols-3">
      <div class="flex flex-col gap-1">
        <label for="servingUnit" class="font-medium">{{ 'foods.form.servingUnit' | t }}</label>
        <p-select
          inputId="servingUnit"
          formControlName="servingUnit"
          [options]="servingUnitOptions()"
          optionLabel="label"
          optionValue="value"
          [fluid]="true"
        />
      </div>

      <div class="flex flex-col gap-1">
        <label for="servingSize" class="font-medium">{{ 'foods.form.servingSize' | t }}</label>
        <p-inputnumber
          inputId="servingSize"
          formControlName="servingSize"
          [min]="0.01"
          [maxFractionDigits]="2"
          [fluid]="true"
          [invalid]="isInvalid('servingSize')"
        />
      </div>

      <div class="flex flex-col gap-1">
        <label for="servingSizeGrams" class="font-medium">{{
          'foods.form.servingSizeGrams' | t
        }}</label>
        <p-inputnumber
          inputId="servingSizeGrams"
          formControlName="servingSizeGrams"
          [min]="0.01"
          [maxFractionDigits]="2"
          [fluid]="true"
          [invalid]="isInvalid('servingSizeGrams')"
        />
      </div>
    </div>

    <div>
      <div class="text-surface-900 dark:text-surface-0 mb-2 font-medium">
        {{ 'foods.form.nutrientsPerServing' | t }}
      </div>
      <div class="grid grid-cols-2 gap-4 sm:grid-cols-5">
        <div class="flex flex-col gap-1">
          <label for="caloriesPerServing" class="text-muted-color text-sm">{{
            'foods.form.calories' | t
          }}</label>
          <p-inputnumber
            inputId="caloriesPerServing"
            formControlName="caloriesPerServing"
            [min]="0"
            [fluid]="true"
            [invalid]="isInvalid('caloriesPerServing')"
          />
        </div>
        <div class="flex flex-col gap-1">
          <label for="proteinGrams" class="text-muted-color text-sm">{{
            'foods.form.protein' | t
          }}</label>
          <p-inputnumber
            inputId="proteinGrams"
            formControlName="proteinGrams"
            [min]="0"
            [maxFractionDigits]="1"
            [fluid]="true"
            [invalid]="isInvalid('proteinGrams')"
          />
        </div>
        <div class="flex flex-col gap-1">
          <label for="carbsGrams" class="text-muted-color text-sm">{{
            'foods.form.carbs' | t
          }}</label>
          <p-inputnumber
            inputId="carbsGrams"
            formControlName="carbsGrams"
            [min]="0"
            [maxFractionDigits]="1"
            [fluid]="true"
            [invalid]="isInvalid('carbsGrams')"
          />
        </div>
        <div class="flex flex-col gap-1">
          <label for="fatGrams" class="text-muted-color text-sm">{{ 'foods.form.fat' | t }}</label>
          <p-inputnumber
            inputId="fatGrams"
            formControlName="fatGrams"
            [min]="0"
            [maxFractionDigits]="1"
            [fluid]="true"
            [invalid]="isInvalid('fatGrams')"
          />
        </div>
        <div class="flex flex-col gap-1">
          <label for="fiberGrams" class="text-muted-color text-sm">{{
            'foods.form.fiber' | t
          }}</label>
          <p-inputnumber
            inputId="fiberGrams"
            formControlName="fiberGrams"
            [min]="0"
            [maxFractionDigits]="1"
            [fluid]="true"
          />
        </div>
      </div>
    </div>

    <div class="flex flex-wrap gap-6">
      <div class="flex items-center gap-2">
        <p-toggleswitch inputId="isVerified" formControlName="isVerified" />
        <label for="isVerified">{{ 'foods.form.isVerified' | t }}</label>
      </div>
      <div class="flex items-center gap-2">
        <p-toggleswitch inputId="isActive" formControlName="isActive" />
        <label for="isActive">{{ 'foods.form.isActive' | t }}</label>
      </div>
    </div>
  </div>
</app-form-dialog>
