<form [formGroup]="form" class="mb-4 flex flex-wrap items-end gap-3">
  <div class="flex min-w-56 flex-1 flex-col gap-1">
    <label for="soldierSearch" class="text-muted-color text-sm">Qidirish</label>
    <input
      pInputText
      id="soldierSearch"
      type="search"
      formControlName="search"
      placeholder="Ism, familiya yoki username"
    />
  </div>

  <div class="flex flex-col gap-1">
    <label for="soldierGender" class="text-muted-color text-sm">Jins</label>
    <p-select
      inputId="soldierGender"
      formControlName="gender"
      [options]="genderOptions"
      optionLabel="label"
      optionValue="value"
      placeholder="Hammasi"
      [showClear]="true"
    />
  </div>

  <div class="flex flex-col gap-1">
    <label for="soldierGoal" class="text-muted-color text-sm">Maqsad</label>
    <p-select
      inputId="soldierGoal"
      formControlName="goal"
      [options]="goalOptions"
      optionLabel="label"
      optionValue="value"
      placeholder="Hammasi"
      [showClear]="true"
    />
  </div>

  <div class="flex flex-col gap-1">
    <label for="soldierExperience" class="text-muted-color text-sm">Tajriba</label>
    <p-select
      inputId="soldierExperience"
      formControlName="experienceLevel"
      [options]="experienceOptions"
      optionLabel="label"
      optionValue="value"
      placeholder="Hammasi"
      [showClear]="true"
    />
  </div>

  <div class="flex flex-col gap-1">
    <label for="soldierPlace" class="text-muted-color text-sm">Joyi</label>
    <p-select
      inputId="soldierPlace"
      formControlName="isHomeWorkout"
      [options]="placeOptions"
      optionLabel="label"
      optionValue="value"
      placeholder="Hammasi"
      [showClear]="true"
    />
  </div>

  <div class="flex flex-col gap-1">
    <label for="soldierJoined" class="text-muted-color text-sm">Ro‘yxatdan o‘tgan</label>
    <p-datepicker
      inputId="soldierJoined"
      formControlName="joined"
      selectionMode="range"
      [readonlyInput]="true"
      [showButtonBar]="true"
      [maxDate]="today"
      dateFormat="dd.mm.yy"
      placeholder="Sanalar oralig‘i"
    />
  </div>

  <p-button
    label="Tozalash"
    icon="pi pi-filter-slash"
    severity="secondary"
    [text]="true"
    (onClick)="reset()"
  />
</form>
