<form [formGroup]="form" class="mb-4 flex flex-wrap items-end gap-3">
  <div class="flex min-w-56 flex-1 flex-col gap-1">
    <label for="search" class="text-muted-color text-sm">{{ 'exercises.filters.searchLabel' | t }}</label>
    <input pInputText id="search" type="search" formControlName="search" [placeholder]="'exercises.filters.searchPlaceholder' | t" />
  </div>

  <div class="flex flex-col gap-1">
    <label for="filterMuscleGroup" class="text-muted-color text-sm">{{ 'exercises.filters.muscleGroup' | t }}</label>
    <p-select
      inputId="filterMuscleGroup"
      formControlName="muscleGroup"
      [options]="muscleGroupOptions()"
      optionLabel="label"
      optionValue="value"
      [placeholder]="'exercises.filters.all' | t"
      [showClear]="true"
    />
  </div>

  <div class="flex flex-col gap-1">
    <label for="filterEquipment" class="text-muted-color text-sm">{{ 'exercises.filters.equipment' | t }}</label>
    <p-select
      inputId="filterEquipment"
      formControlName="equipmentType"
      [options]="equipmentTypeOptions()"
      optionLabel="label"
      optionValue="value"
      [placeholder]="'exercises.filters.all' | t"
      [showClear]="true"
    />
  </div>

  <div class="flex flex-col gap-1">
    <label for="filterGender" class="text-muted-color text-sm">{{ 'exercises.filters.gender' | t }}</label>
    <p-select
      inputId="filterGender"
      formControlName="gender"
      [options]="genderOptions()"
      optionLabel="label"
      optionValue="value"
      [placeholder]="'exercises.filters.all' | t"
      [showClear]="true"
    />
  </div>

  <div class="flex flex-col gap-1">
    <label for="filterPlace" class="text-muted-color text-sm">{{ 'exercises.filters.place' | t }}</label>
    <p-select
      inputId="filterPlace"
      formControlName="isHomeExercise"
      [options]="placeOptions()"
      optionLabel="label"
      optionValue="value"
      [placeholder]="'exercises.filters.all' | t"
      [showClear]="true"
    />
  </div>

  <div class="flex flex-col gap-1">
    <label for="filterActivity" class="text-muted-color text-sm">{{ 'exercises.filters.activity' | t }}</label>
    <p-select
      inputId="filterActivity"
      formControlName="isActive"
      [options]="activityOptions()"
      optionLabel="label"
      optionValue="value"
      [placeholder]="'exercises.filters.all' | t"
      [showClear]="true"
    />
  </div>

  <p-button
    [label]="'exercises.filters.clear' | t"
    icon="pi pi-filter-slash"
    severity="secondary"
    [text]="true"
    (onClick)="reset()"
  />
</form>
