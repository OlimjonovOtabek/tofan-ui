<div class="card">
  <div class="mb-4 flex flex-wrap items-center justify-between gap-3">
    <div>
      <h1 class="text-surface-900 dark:text-surface-0 m-0 text-xl font-semibold">
        Mashqlar katalogi
      </h1>
      <span class="text-muted-color text-sm"
        >Jami {{ store.loadError() === null ? store.totalCount() : '—' }} mashq</span
      >
    </div>
    <p-button label="Mashq qo'shish" icon="pi pi-plus" (onClick)="add()" />
  </div>

  <app-exercise-filters (filterChange)="applyFilter($event)" />

  <app-data-table
    [columns]="columns"
    [items]="store.exercises()"
    [totalCount]="store.totalCount()"
    [loading]="store.loading()"
    [error]="store.loadError()"
    [first]="store.first()"
    emptyMessage="Bu shartlarga mos mashq topilmadi."
    (pageChange)="loadPage($event)"
    (retry)="store.load()"
  >
    <ng-template #row let-exercise>
      <tr>
        <td>
          <div class="font-medium">{{ exercise.displayName }}</div>
          <div class="text-muted-color text-sm">{{ exercise.name }}</div>
        </td>
        <td>{{ muscleGroupLabel(exercise) }}</td>
        <td>{{ equipmentTypeLabel(exercise) }}</td>
        <td>{{ difficultyLabel(exercise) }}</td>
        <td>
          <p-tag
            [value]="exercise.isActive ? 'Faol' : 'Faol emas'"
            [severity]="exercise.isActive ? 'success' : 'secondary'"
          />
        </td>
        <td class="text-right whitespace-nowrap">
          @if (exercise.hasVideo()) {
            <i class="pi pi-video text-muted-color mr-2" title="Video yuklangan"></i>
          }
          <p-button
            icon="pi pi-pencil"
            severity="secondary"
            [text]="true"
            [rounded]="true"
            ariaLabel="Tahrirlash"
            (onClick)="edit(exercise)"
          />
          <p-button
            [icon]="exercise.isActive ? 'pi pi-eye-slash' : 'pi pi-check'"
            severity="secondary"
            [text]="true"
            [rounded]="true"
            [ariaLabel]="exercise.isActive ? 'Faolsizlantirish' : 'Faollashtirish'"
            (onClick)="store.toggleActivation(exercise)"
          />
          <p-button
            icon="pi pi-trash"
            severity="danger"
            [text]="true"
            [rounded]="true"
            ariaLabel="O'chirish"
            (onClick)="remove(exercise)"
          />
        </td>
      </tr>
    </ng-template>
  </app-data-table>
</div>

<app-exercise-form-dialog
  [(visible)]="dialogVisible"
  [exercise]="editedExercise()"
  [saving]="store.saving()"
  (save)="saveDraft($event)"
/>
