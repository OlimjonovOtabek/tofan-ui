<app-floating-theme-switcher />
<div class="fixed top-4 right-4 z-50 flex gap-2">
  <app-language-switcher />
</div>

<div
  class="bg-surface-50 dark:bg-surface-950 flex items-center justify-center min-h-screen min-w-screen overflow-hidden"
>
  <div class="flex flex-col items-center justify-center">
    <div
      class="rounded-[56px] p-[0.3rem]"
      style="
        background: linear-gradient(180deg, var(--primary-color) 10%, rgba(33, 150, 243, 0) 30%);
      "
    >
      <div class="w-full bg-surface-0 dark:bg-surface-900 py-20 px-8 sm:px-20 rounded-[53px]">
        <div class="text-center mb-8">
          <app-logo class="mb-8 h-24 mx-auto" />
          <div class="text-surface-900 dark:text-surface-0 text-3xl font-medium mb-4">
            {{ 'auth.login.title' | t }}
          </div>
          <span class="text-muted-color font-medium">{{ 'auth.login.subtitle' | t }}</span>
        </div>

        <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col" novalidate>
          @if (errorMessage(); as message) {
            <p-message severity="error" styleClass="mb-6">{{ message | t }}</p-message>
          }

          <label
            for="username"
            class="block text-surface-900 dark:text-surface-0 text-xl font-medium mb-2"
          >
            {{ 'auth.login.usernameLabel' | t }}
          </label>
          <input
            pInputText
            id="username"
            type="text"
            autocomplete="username"
            [placeholder]="'auth.login.usernamePlaceholder' | t"
            class="w-full md:w-120"
            formControlName="username"
            [invalid]="isInvalid('username')"
          />
          <small class="text-red-500 min-h-6 mt-1">
            @if (isInvalid('username')) {
              {{ 'auth.login.usernameRequired' | t }}
            }
          </small>

          <label
            for="password"
            class="block text-surface-900 dark:text-surface-0 font-medium text-xl mb-2 mt-2"
          >
            {{ 'auth.login.passwordLabel' | t }}
          </label>
          <p-password
            inputId="password"
            formControlName="password"
            [placeholder]="'auth.login.passwordPlaceholder' | t"
            autocomplete="current-password"
            [toggleMask]="true"
            [fluid]="true"
            [feedback]="false"
            [invalid]="isInvalid('password')"
          />
          <small class="text-red-500 min-h-6 mt-1 mb-6">
            @if (isInvalid('password')) {
              {{ 'auth.login.passwordRequired' | t }}
            }
          </small>

          <p-button type="submit" [label]="'auth.login.submit' | t" styleClass="w-full" [loading]="isSubmitting()" />
        </form>
      </div>
    </div>
  </div>
</div>
