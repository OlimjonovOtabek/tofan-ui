# Placeholder contract. Replace it with the real Tofan backend specification
# (or point ng-openapi-gen.json "input" at the backend's /v3/api-docs URL)
# and run `npm run api:generate`.
openapi: 3.0.3
info:
  title: Tofan Admin API
  version: 0.1.0
servers:
  - url: /api
tags:
  - name: Auth
paths:
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Exchanges user credentials for an access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid credentials
  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Returns the profile of the authenticated user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          description: Not authenticated
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    TokenResponse:
      type: object
      required: [accessToken, expiresIn]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          description: Access token lifetime in seconds
    UserProfileResponse:
      type: object
      required: [id, username, fullName, roles]
      properties:
        id:
          type: string
        username:
          type: string
        fullName:
          type: string
        roles:
          type: array
          items:
            type: string
security:
  - bearerAuth: []
